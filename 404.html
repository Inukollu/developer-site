  <!--
    The SVG first and the .ico second, which is the order browsers read them in: anything that
    understands image/svg+xml takes the vector and scales it, and the rest fall through to the
    file they were going to request at /favicon.ico anyway.

    Both are generated from the same source, so they cannot drift. The .ico carries 16 through
    256 because Windows picks a size per context -- a tab, a taskbar, a desktop shortcut -- and
    one 32px image upscaled into a shortcut is the usual way an icon ends up looking blurred.
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
